<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Weihnachtsfest 17.12. — Songwünsche</title>
<meta name="description" content="Reich deine Songwünsche fürs Weihnachtsfest ein und votet euch gegenseitig hoch — anonym, in 30 Sekunden.">
<link rel="icon" href="../icons/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120f0c;
  --card:#1f1912;
  --gold:#d4af6a;
  --gold-light:#f0d798;
  --green:#3a5a40;
  --green-light:#7a9b7e;
  --text:#f6f1e7;
  --text-dim:#a89a86;
  --border:rgba(255,255,255,0.08);
  --danger:#ff6b6b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);overflow-x:hidden;}
body{
  position:relative;
  font-family:'Quicksand',sans-serif;
  color:var(--text);
}
.app{
  position:relative;
  max-width:480px;
  margin:0 auto;
  padding:28px 20px 60px;
}
.snowfield{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.flake{ position:absolute; top:-10%; color:rgba(240,215,152,0.35); font-size:14px; animation:fall linear infinite; }
@keyframes fall{ to{ transform:translateY(115vh); } }
@media (prefers-reduced-motion: reduce){ .flake{ animation:none; display:none; } }

.eyebrow{
  position:relative; z-index:1;
  font-weight:700;
  letter-spacing:.08em;
  font-size:12px;
  color:var(--gold-light);
  text-transform:uppercase;
  margin-bottom:10px;
  display:flex; align-items:center; gap:6px;
}
.headline{
  position:relative; z-index:1;
  font-family:'Anton',sans-serif;
  font-weight:400;
  font-size:38px;
  line-height:1.06;
  letter-spacing:.01em;
  margin:0 0 14px;
  text-transform:uppercase;
}
.headline .accent{
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sub{
  position:relative; z-index:1;
  font-size:15px;
  line-height:1.5;
  color:var(--text-dim);
  margin:0 0 28px;
  max-width:36ch;
}
.card{
  position:relative; z-index:1;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-bottom:28px;
}
.submit-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.submit-title{ font-family:'Anton',sans-serif; font-size:19px; letter-spacing:.02em; text-transform:uppercase; }
.tickets-badge{ font-weight:700; font-size:13px; color:var(--gold); letter-spacing:.04em; white-space:nowrap; }
.divider{ border-top:1px dashed var(--border); margin-bottom:18px; }
.field-label{ display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
.field{
  width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; color:var(--text); font-family:'Quicksand',sans-serif; font-size:15px; margin-bottom:16px;
  outline:none; transition:border-color .15s;
}
.field:focus{ border-color:var(--gold); }
.field::placeholder{ color:var(--text-dim); }
.field:disabled{ opacity:.4; }
.submit-btn{
  width:100%; background:transparent; border:1.5px solid var(--gold); color:var(--gold);
  font-family:'Anton',sans-serif; font-size:15px; letter-spacing:.05em; text-transform:uppercase;
  padding:14px; border-radius:10px; cursor:pointer; transition:background .15s, color .15s;
}
.submit-btn:hover:not(:disabled){ background:var(--gold); color:#1a1410; }
.submit-btn:disabled{ opacity:.4; cursor:not-allowed; border-color:var(--text-dim); color:var(--text-dim); }
.helper{ font-size:13px; color:var(--text-dim); margin:12px 0 0; text-align:center; }
.error-text{ font-size:13px; color:var(--danger); margin:10px 0 0; text-align:center; display:none; }
.chart-header{ position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.chart-title{ font-family:'Anton',sans-serif; font-size:23px; letter-spacing:.02em; text-transform:uppercase; }
.chart-meta{ display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:13px; }
.refresh-btn{
  background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text);
  width:30px;height:30px; border-radius:50%; cursor:pointer; font-size:15px;
  display:flex;align-items:center;justify-content:center; transition:transform .3s;
}
.refresh-btn:active{ transform:rotate(180deg); }
.chart-list{ position:relative; z-index:1; display:flex; flex-direction:column; gap:12px; }
.chart-item{
  display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:16px 18px; will-change:transform,opacity;
}
.chart-item.leader{
  border-color:var(--gold);
  background:linear-gradient(120deg, rgba(212,175,106,0.14), var(--card) 60%);
  box-shadow:0 0 26px rgba(212,175,106,.14);
}
.chart-item.in-set{ border-color:var(--green-light); }
.chart-item.enter{ animation:enter .32s ease both; }
@keyframes enter{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .chart-item{ transition:none !important; animation:none !important; } }
.rank{ font-family:'Anton',sans-serif; font-size:28px; width:32px; flex-shrink:0; }
.rank.gold{ color:var(--gold); }
.rank.green{ color:var(--green-light); }
.song-info{ flex:1; min-width:0; }
.song-title{ font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-artist{ font-size:13px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:6px; align-items:center; }
.in-set-tag{ font-size:11px; color:var(--green-light); font-weight:700; flex-shrink:0; }
.item-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.vote-btn{
  display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.06); border:1px solid var(--border);
  border-radius:999px; padding:6px; cursor:pointer;
}
.vote-plus{ width:24px;height:24px; border-radius:50%; background:var(--gold); color:#1a1410; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:15px; }
.vote-count{ font-weight:700; font-size:15px; min-width:20px; text-align:center; padding-right:6px; display:inline-block; transition:transform .15s; }
.vote-count.bump{ transform:scale(1.3); }
.more-btn{
  width:100%; margin-top:14px; background:transparent; border:1px dashed var(--border); color:var(--text-dim);
  padding:12px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;
}
.more-btn:hover{ border-color:var(--gold); color:var(--gold); }
.empty-state{ position:relative; z-index:1; text-align:center; padding:36px 20px; color:var(--text-dim); font-size:14px; border:1px dashed var(--border); border-radius:14px; }
.footer-note{ position:relative; z-index:1; text-align:center; font-size:12px; color:var(--text-dim); margin-top:32px; letter-spacing:.02em; }
.footer-note a{ color:var(--text-dim); }
.loading{ position:relative; z-index:1; text-align:center; color:var(--text-dim); padding:40px 0; font-size:14px; }
</style>
</head>
<body>

<div class="snowfield" id="snowfield"></div>
<div class="app">
  <div class="eyebrow"><span>❆</span> Live-Chart · Weihnachtsfest 17.12.</div>
  <h1 class="headline">Das Set<br><span class="accent">entsteht hier</span></h1>
  <p class="sub">Reich deine Wünsche ein, votet euch gegenseitig hoch — die Top-Songs landen garantiert im Set.</p>

  <div class="card">
    <div class="submit-head">
      <span class="submit-title">Wunsch einreichen</span>
      <span class="tickets-badge" id="ticketsBadge">3 Tickets</span>
    </div>
    <div class="divider"></div>
    <label class="field-label" for="titleInput">Titel</label>
    <input id="titleInput" class="field" placeholder="z. B. Blinding Lights" maxlength="120" />
    <label class="field-label" for="artistInput">Interpret</label>
    <input id="artistInput" class="field" placeholder="z. B. The Weeknd" maxlength="120" />
    <button id="submitBtn" class="submit-btn">Ticket einlösen</button>
    <p class="helper" id="helperText"></p>
    <p class="error-text" id="errorText"></p>
  </div>

  <div class="chart-header">
    <span class="chart-title">Live-Chart</span>
    <div class="chart-meta">
      <span id="songCount">– Songs im Rennen</span>
      <button id="refreshBtn" class="refresh-btn" title="Aktualisieren">⟳</button>
    </div>
  </div>

  <div id="chartList" class="loading">Lädt …</div>
  <p class="footer-note">Anonym · kein Login · nur für die Set-Planung.</p>
</div>

<script>
(function(){
  const SUPABASE_URL = "https://nacxltgqyijpdezlgwxw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hY3hsdGdxeWlqcGRlemxnd3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDUyNTQsImV4cCI6MjEwMjgyMTI1NH0.-9bN-QKaBgE2pRbqngDflCD6P9k37DW_ZO4_wqYWl9s";
  const PAGE_SIZE = 50;
  const MAX_TICKETS = 3;
  const POLL_MS = 15000;
  const TICKETS_KEY = 'weihnachtsfest-tickets-used';
  const VOTED_KEY = 'weihnachtsfest-voted-ids'; // reserved for a future per-person vote lock, see voteFor()
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let wishes = [];
  let lastVotedId = null;
  let visibleCount = PAGE_SIZE;

  const el = (id) => document.getElementById(id);
  const escapeHtml = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  if(!reduceMotion){
    const field = el('snowfield');
    for(let i=0;i<14;i++){
      const f = document.createElement('span');
      f.className = 'flake';
      f.textContent = '❆';
      f.style.left = Math.random()*100 + '%';
      f.style.fontSize = (10 + Math.random()*10) + 'px';
      f.style.animationDuration = (14 + Math.random()*14) + 's';
      f.style.animationDelay = (Math.random()*14) + 's';
      field.appendChild(f);
    }
  }

  async function sb(path, opts){
    const res = await fetch(SUPABASE_URL + path, Object.assign({
      headers: Object.assign({
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json'
      }, (opts && opts.headers) || {})
    }, opts));
    const data = await res.json().catch(() => null);
    if(!res.ok){
      const msg = (data && (data.message || data.hint || data.error)) || res.statusText;
      throw new Error(msg);
    }
    return data;
  }

  function getTicketsUsed(){ return parseInt(localStorage.getItem(TICKETS_KEY) || '0', 10); }
  function bumpTicketsUsed(){ localStorage.setItem(TICKETS_KEY, String(getTicketsUsed() + 1)); }

  function showError(msg){
    const errorEl = el('errorText');
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    setTimeout(() => { errorEl.style.display = 'none'; }, 4000);
  }

  function renderTickets(){
    const remaining = Math.max(0, MAX_TICKETS - getTicketsUsed());
    el('ticketsBadge').textContent = remaining + ' Ticket' + (remaining === 1 ? '' : 's');
    el('helperText').textContent = remaining > 0
      ? `Noch ${remaining} von ${MAX_TICKETS} Wunsch-Tickets übrig.`
      : 'Keine Wunsch-Tickets mehr übrig.';
    const btn = el('submitBtn');
    const inputs = [el('titleInput'), el('artistInput')];
    btn.disabled = remaining <= 0;
    inputs.forEach(i => i.disabled = remaining <= 0);
  }

  function renderChart(){
    const listEl = el('chartList');
    const before = new Map();
    if(!reduceMotion){
      listEl.querySelectorAll('.chart-item').forEach(item => {
        const id = item.getAttribute('data-item-id');
        if(id) before.set(id, item.getBoundingClientRect());
      });
    }

    const sorted = wishes.slice().sort((a, b) => b.votes - a.votes || new Date(a.created_at) - new Date(b.created_at));
    el('songCount').textContent = sorted.length + (sorted.length === 1 ? ' Song im Rennen' : ' Songs im Rennen');

    if(sorted.length === 0){
      listEl.className = 'empty-state';
      listEl.innerHTML = 'Noch keine Wünsche eingereicht — sei die oder der Erste!';
      return;
    }

    const shown = sorted.slice(0, Math.min(visibleCount, sorted.length));

    listEl.className = 'chart-list';
    listEl.innerHTML = shown.map((w, i) => {
      const isLeader = i === 0;
      const inSet = w.status === 'im_set';
      const rankColor = i % 2 === 0 ? 'gold' : 'green';
      const bump = w.id === lastVotedId ? 'bump' : '';
      const isNew = !before.has(w.id) && before.size > 0;
      return `
        <div class="chart-item ${isLeader ? 'leader' : ''} ${inSet ? 'in-set' : ''} ${isNew ? 'enter' : ''}" data-item-id="${w.id}">
          <div class="rank ${rankColor}">${i + 1}</div>
          <div class="song-info">
            <div class="song-title">${escapeHtml(w.title)}</div>
            <div class="song-artist">${escapeHtml(w.artist)} ${inSet ? '<span class="in-set-tag">✓ Im Set</span>' : ''}</div>
          </div>
          <div class="item-actions">
            <button class="vote-btn" data-vote-id="${w.id}">
              <span class="vote-count ${bump}">${w.votes}</span>
              <span class="vote-plus">+</span>
            </button>
          </div>
        </div>
      `;
    }).join('');

    if(sorted.length > visibleCount){
      const moreBtn = document.createElement('button');
      moreBtn.className = 'more-btn';
      moreBtn.textContent = `Weitere anzeigen (${sorted.length - visibleCount} übrig)`;
      moreBtn.addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        renderChart();
      });
      listEl.appendChild(moreBtn);
    }

    listEl.querySelectorAll('.vote-btn').forEach(btn => {
      btn.addEventListener('click', () => voteFor(btn.getAttribute('data-vote-id')));
    });

    if(!reduceMotion){
      listEl.querySelectorAll('.chart-item').forEach(item => {
        const id = item.getAttribute('data-item-id');
        const oldRect = before.get(id);
        if(!oldRect) return;
        const newRect = item.getBoundingClientRect();
        const deltaY = oldRect.top - newRect.top;
        if(deltaY){
          item.style.transform = `translateY(${deltaY}px)`;
          item.style.transition = 'none';
          requestAnimationFrame(() => {
            item.style.transition = 'transform 320ms ease';
            item.style.transform = '';
          });
        }
      });
    }

    lastVotedId = null;
  }

  async function loadWishes(){
    try{
      wishes = await sb('/rest/v1/wishes_public?select=*', { method: 'GET' });
    }catch(e){
      wishes = [];
    }
  }

  async function voteFor(id){
    // Später nachrüstbar: hier vor dem Request gegen eine in localStorage[VOTED_KEY]
    // gespeicherte Liste bereits gevoteter IDs prüfen, um Mehrfach-Voting pro Person zu sperren.
    const w = wishes.find(w => w.id === id);
    if(!w) return;
    w.votes += 1;
    lastVotedId = id;
    renderChart();
    try{
      await sb('/rest/v1/rpc/vote_wish', { method: 'POST', body: JSON.stringify({ p_id: id }) });
    }catch(e){ /* optimistisches Update bleibt bestehen, nächster Poll gleicht ab */ }
  }

  async function submitWish(){
    const titleInput = el('titleInput');
    const artistInput = el('artistInput');
    const title = titleInput.value.trim();
    const artist = artistInput.value.trim();

    if(!title || !artist){ showError('Bitte Titel und Interpret angeben.'); return; }
    if(getTicketsUsed() >= MAX_TICKETS){ showError('Keine Wunsch-Tickets mehr übrig.'); return; }

    const btn = el('submitBtn');
    btn.disabled = true;
    try{
      const row = await sb('/rest/v1/rpc/submit_wish', {
        method: 'POST',
        body: JSON.stringify({ p_title: title, p_artist: artist })
      });
      bumpTicketsUsed();
      titleInput.value = '';
      artistInput.value = '';
      lastVotedId = row.id;
      await loadWishes();
      renderChart();
    }catch(e){
      showError('Konnte nicht gespeichert werden. Nochmal versuchen?');
    }
    renderTickets();
  }

  async function refreshAll(){
    await loadWishes();
    renderChart();
  }

  el('submitBtn').addEventListener('click', submitWish);
  el('refreshBtn').addEventListener('click', refreshAll);
  [el('titleInput'), el('artistInput')].forEach(input => {
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitWish(); });
  });

  (async function init(){
    renderTickets();
    await loadWishes();
    renderChart();
    setInterval(refreshAll, POLL_MS);
  })();
})();
</script>
</body>
</html>
