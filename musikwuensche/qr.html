<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Musikwünsche — Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FBF7FF;--text:#1B1526;--text-muted:#7A7288;--accent:#E01E7A;--accent-2:#7C3AED;--border:#EBE2F4;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Outfit',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.controls{position:fixed;top:1rem;right:1rem;display:flex;gap:.5rem}
.controls button,.controls input{font:inherit;font-size:.82rem;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer}
.poster{width:100%;max-width:520px;background:#fff;border-radius:28px;padding:3rem 2.2rem;text-align:center;box-shadow:0 20px 60px rgba(90,30,100,.18);border:1px solid var(--border)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:.8rem}
h1{font-family:var(--font-display);font-size:2.6rem;font-weight:600;line-height:1.05;margin-bottom:.6rem}
h1 em{font-style:italic;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--text-muted);font-size:1rem;margin-bottom:2rem}
.qr-box{display:inline-block;padding:1.1rem;background:#fff;border:2px solid var(--border);border-radius:20px}
.qr-box img{display:block;width:280px;height:280px;max-width:100%}
.url-line{margin-top:1.6rem;font-size:.85rem;color:var(--text-muted);word-break:break-all}
.footer-note{margin-top:1.4rem;font-size:.78rem;color:var(--text-muted)}
@media print{
  .controls{display:none}
  body{padding:0;background:#fff}
  .poster{box-shadow:none;border:none;max-width:100%}
}
</style>
</head>
<body>

<div class="controls">
  <input type="text" id="urlInput" placeholder="URL der Wunsch-Seite" style="width:260px">
  <button onclick="applyUrl()">Übernehmen</button>
  <button onclick="window.print()">🖨️ Drucken</button>
</div>

<div class="poster">
  <div class="eyebrow">Aula-Abend</div>
  <h1>Musik<em>wünsche</em></h1>
  <p class="sub">QR-Code scannen &amp; deine Songs eintragen — anonym, 30 Sekunden.</p>
  <div class="qr-box">
    <img id="qrImg" alt="QR-Code zur Musikwunsch-Seite">
  </div>
  <div class="url-line" id="urlLine"></div>
  <div class="footer-note">bis zu 3 Wünsche pro Handy 🎶</div>
</div>

<script>
const DEFAULT_URL = "https://6zfcnkkw6n-debug.github.io/Spielereien-/musikwuensche/";

function render(url){
  document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=560x560&margin=8&data=' + encodeURIComponent(url);
  document.getElementById('urlLine').textContent = url;
  document.getElementById('urlInput').value = url;
  localStorage.setItem('mw_poster_url', url);
}

function applyUrl(){
  const v = document.getElementById('urlInput').value.trim();
  if(v) render(v);
}

render(localStorage.getItem('mw_poster_url') || DEFAULT_URL);
</script>
</body>
</html>
